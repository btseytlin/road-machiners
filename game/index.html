<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Road Machiners</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
    <style>
      #overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
      #overlay .vehicle-marker { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 3px; pointer-events: none; font: 11px/1.2 var(--font-mono); color: #f0e0b8; }
      #overlay .marker-weapons { display: flex; gap: 3px; }
      #overlay .vehicle-marker.aims-hidden .marker-weapons, #overlay .vehicle-marker.aims-hidden .marker-radio { display: none; }
      #overlay .marker-weapon { position: relative; display: flex; flex-direction: column; align-items: center; padding: 2px 4px 3px; background: #261c14ee; border: 2px solid #8a8f88; border-radius: 4px; }
      #overlay .marker-weapon.ready { border-color: #e06a3c; }
      #overlay .marker-weapon .icon { width: 30px; height: 30px; }
      #overlay .marker-weapon.ready .icon svg { fill: #b04a26; }
      #overlay .marker-weapon.blocked { color: #a8a498; }
      #overlay .marker-slot { position: absolute; top: 1px; left: 3px; font-weight: bold; }
      #overlay .marker-status { white-space: nowrap; }
      #overlay .marker-job { min-width: 72px; max-width: 180px; padding: 3px 6px 4px; background: #261c14ee; border-radius: 3px; text-align: center; }
      #overlay .marker-radio, #overlay .marker-out { padding: 3px 6px; background: #261c14ee; border-radius: 3px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="overlay"></div>
    <div id="ui"></div>
    <script type="module" src="/src/three/main.ts"></script>
  </body>
</html>
