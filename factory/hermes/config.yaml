# Hermes config template for the game factory chat bot.
# Keys were checked against cli-config.yaml.example in the Hermes source.
model:
  # Hermes chats through the ChatGPT subscription. Sign in once with `hermes auth add openai-codex`.
  provider: openai-codex
  default: gpt-6-sol

telegram:
  require_mention: true
  # Deploys restart Hermes often. Its "shutting down" and "back online" posts are noise in the committee chat.
  gateway_restart_notification: false

# Keep Hermes's own notices out of the committee chat.
compression:
  codex_gpt55_autoraise_notice: false
  # Compress the context once the estimated prompt reaches this many tokens.
  threshold_tokens: 100000

# The summary of a long chat used the main model's default reasoning. It thought silently past the 60-second stall limit, failed, and left the chat over the threshold.
auxiliary:
  compression:
    reasoning_effort: low
    no_progress_timeout: 180

display:
  # A message sent while Hermes works waits for the next turn, instead of cutting the running task off. /stop still interrupts.
  busy_input_mode: queue
  # The background self-improvement review reads only this global key, not the per-platform one. The review still runs.
  memory_notifications: "off"
  platforms:
    telegram:
      tool_progress: "off"
      interim_assistant_messages: false
      long_running_notifications: false
      streaming: false
      memory_notifications: "off"

# Hermes's shell and scripts get only the env keys named here. allowlist.py copies them into the Hermes .env.
terminal:
  env_passthrough:
    - FACTORY_REPO
    # Hermes runs tools with its own HOME, so gh needs the folder of its login.
    - GH_CONFIG_DIR

# Hermes acts on the factory without waiting on approval cards. Its prompt waited 5 minutes for an answer nobody saw, then dropped the step. SOUL.md says what to ask the committee first.
approvals:
  mode: "off"
  # /new, /reset and /undo run without an "Approve Once / Always Approve" prompt.
  destructive_slash_confirm: false

# A scheduled job's post is Hermes's message alone, with no "Cronjob Response" header or footer.
cron:
  wrap_response: false

# Hermes core ignores session_reset since v2026.9.11. The hermes-session-reset-policy plugin reads this block and resets a chat that sat idle, on its next message. A chat with a turn in flight never resets.
session_reset:
  mode: idle
  idle_minutes: 60

plugins:
  enabled:
    - factory
    - hermes-session-reset-policy

# The file toolset also holds write and patch. Hermes has no read-only file toolset.
platform_toolsets:
  telegram:
    - terminal
    - file
    - skills
    - memory
    - session_search
    - vision
    - factory
  # The incident watch job runs with no chat. It resolves incidents and drafts the release post with the same tools.
  cron:
    - terminal
    - file
    - skills
    - memory
    - factory
    - session_search
    - vision
    - factory

# Off everywhere, the command line included. Hermes runs commands through terminal, and game work goes to the factory as ad hoc tasks. The start script owns the incident watch, so Hermes needs no cronjob.
agent:
  disabled_toolsets:
    - connections
    - browser
    - video
    - image_gen
    - video_gen
    - bfl
    - moa
    - tts
    - x_search
    - delegation
    - code_execution
    - cronjob
    - clarify
    - messaging
    - homeassistant
    - spotify
    - discord
    - discord_admin
    - yuanbao
    - computer_use
    - context_engine
    - project
    - desktop_ui
    - kanban
    - feishu_doc
    - feishu_drive
