name: factory-caddy

services:
  caddy:
    container_name: factory-caddy
    image: caddy:2.10-alpine
    restart: unless-stopped
    # Caddy publishes no ports. The tunnel reaches it at http://caddy:80 on this stack's network.
    environment:
      DOMAIN: ${FACTORY_DOMAIN:?set FACTORY_DOMAIN}
      ITCH_URL: ${FACTORY_ITCH_URL:?set FACTORY_ITCH_URL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/factory/www:/srv/www:ro
      - /opt/factory/dashboard:/opt/factory/dashboard:ro
      - /opt/factory/caddy/data:/data
      - /opt/factory/caddy/config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    cpus: 1
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # The tunnel dials out to Cloudflare, so the host opens no inbound port. Its routes to http://caddy:80 live in the Cloudflare dashboard.
  tunnel:
    container_name: factory-tunnel
    image: cloudflare/cloudflared:2026.7.3
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    # Deploy writes TUNNEL_TOKEN there. It sits outside this folder, since the stack sync deletes unknown files.
    env_file: /opt/factory/tunnel.env
    depends_on:
      - caddy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 1
    mem_limit: 256m
    pids_limit: 128
